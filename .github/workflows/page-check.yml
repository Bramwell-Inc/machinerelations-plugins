# The org-required page check. An org ruleset ("Require workflows to pass") points at this file, so it runs
# on every pull request of every repo in the org. Another org keeps its own copy of this caller; the code
# comes from actions/page-check here.
# The pull request comment is clean, blocking, or not judged. Not judged (no site, preview refused,
# preview not built, no production to compare, or the checker did not finish) passes the job and is a
# separate result from clean. Only blocking fails the job. Requiring this workflow does not judge a push
# straight to the default branch, and it does not make a not-judged run into a reading of the pages.
# A site merge gate still has to treat a skipped Page check as unfinished. Preview trust is per Vercel project.
# Sampling limits are in the page-check reference, plugins/machine-relations-index/skills/page-check/references/how-it-works.md.
# No stored secret: GitHub's own token finds the preview, and the run's OIDC identity gets past preview
# protection on Vercel projects that trust the org's GitHub Actions. ANTHROPIC_API_KEY is optional (taste notes).
name: Page check
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
  deployments: read
  id-token: write
concurrency:
  group: page-check-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  page-check:
    # The skills repo is not a site. Runs on drafts too: the org ruleset never delivers ready_for_review,
    # so a draft-only head would otherwise reach a merge gate with a skipped page check.
    if: github.repository != 'Bramwell-Inc/machinerelations-plugins'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: Bramwell-Inc/machinerelations-plugins/actions/page-check@main
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

name: Validate and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      draft_id:
        description: Existing Zenodo deposition id to read
        required: true
        type: string
      expect_version:
        description: Version that draft must already carry
        required: true
        type: string
      expect_concept:
        description: conceptrecid the draft must already carry
        required: true
        type: string
      expect_doi:
        description: prereserved DOI the draft must already carry
        required: true
        type: string
      action:
        description: inspect reads only. delete-one removes one listed draft file after the checks pass, and stops if Zenodo returns 500.
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - delete-one
      file_id:
        description: File id on that draft. Used only when action is delete-one.
        required: false
        type: string
permissions:
  contents: read
jobs:
  package:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.package.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/release.test.mjs scripts/zenodo-draft.test.mjs plugins/machine-relations-index/skills/*/scripts/*.test.mjs actions/*/*.test.mjs
      - run: node scripts/validate-package.mjs
        env:
          PACKAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Fresh Codex and Claude Code installations
        shell: bash
        env:
          CODEX_HOME: ${{ runner.temp }}/mr-codex
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/mr-claude
          CLAUDE_CODE_DISABLE_OFFICIAL_MARKETPLACE_AUTOINSTALL: '1'
        run: |
          mkdir -p "$CODEX_HOME" "$CLAUDE_CONFIG_DIR"
          npm exec --yes --package=@openai/codex@0.163.0 -- codex plugin marketplace add "$GITHUB_WORKSPACE" --json
          npm exec --yes --package=@openai/codex@0.163.0 -- codex plugin add machine-relations-index@machinerelations --json | tee "$RUNNER_TEMP/mr-codex-install.json"
          npm exec --yes --package=@openai/codex@0.163.0 -- codex plugin list --json
          npm exec --yes --package=@anthropic-ai/claude-code@2.1.308 -- claude plugin marketplace add "$GITHUB_WORKSPACE"
          npm exec --yes --package=@anthropic-ai/claude-code@2.1.308 -- claude plugin install machine-relations-index@machinerelations
          npm exec --yes --package=@anthropic-ai/claude-code@2.1.308 -- claude plugin list --json | tee "$RUNNER_TEMP/mr-claude-install.json"
          node scripts/verify-fresh-install.mjs
      - name: Package the tested source
        id: package
        shell: bash
        run: |
          VERSION=$(node -p "require('./plugins/machine-relations-index/plugin.json').version")
          mkdir -p dist
          (cd plugins/machine-relations-index && zip -qrX ../../dist/machine-relations-index.zip .)
          node scripts/build-release.mjs --dist dist
          echo "name=machine-relations-index-${VERSION}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/
          if-no-files-found: error

  # A merged version bump becomes one release: Zenodo DOI, GitHub release with
  # the exact files tested above, then both sites rebuild from it. A version
  # that is already released ends the job at its first check.
  release:
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: dist
      - name: Publish the release
        run: node scripts/publish-release.mjs --dist dist
        env:
          GH_TOKEN: ${{ github.token }}
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          VERCEL_DEPLOY_HOOKS: |
            ${{ secrets.VERCEL_DEPLOY_HOOK_JAXONPARROTT }}
            ${{ secrets.VERCEL_DEPLOY_HOOK_MACHINERELATIONS }}

  # Read an existing Zenodo draft with the release credential. inspect is the
  # default and performs no write. delete-one is a single documented file
  # delete after the id, version, concept and reserved DOI match, and it stops
  # on HTTP 500. It does not delete the deposition or publish.
  zenodo-draft:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read the existing draft
        run: node scripts/zenodo-draft.mjs
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          DRAFT_ID: ${{ inputs.draft_id }}
          EXPECT_VERSION: ${{ inputs.expect_version }}
          EXPECT_CONCEPT: ${{ inputs.expect_concept }}
          EXPECT_DOI: ${{ inputs.expect_doi }}
          ACTION: ${{ inputs.action }}
          FILE_ID: ${{ inputs.file_id }}

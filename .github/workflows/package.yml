name: Validate and package
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-package.mjs
        env:
          PACKAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Fresh Codex and Claude Code installations
        shell: bash
        env:
          CODEX_HOME: ${{ runner.temp }}/mr-codex
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/mr-claude
          CLAUDE_CODE_DISABLE_OFFICIAL_MARKETPLACE_AUTOINSTALL: '1'
        run: |
          mkdir -p "$CODEX_HOME" "$CLAUDE_CONFIG_DIR"
          npm exec --yes --package=@openai/codex@0.163.0 -- codex plugin marketplace add "$GITHUB_WORKSPACE" --json
          npm exec --yes --package=@openai/codex@0.163.0 -- codex plugin add machine-relations-index@machinerelations --json | tee "$RUNNER_TEMP/mr-codex-install.json"
          npm exec --yes --package=@openai/codex@0.163.0 -- codex plugin list --json
          npm exec --yes --package=@anthropic-ai/claude-code@2.1.308 -- claude plugin marketplace add "$GITHUB_WORKSPACE"
          npm exec --yes --package=@anthropic-ai/claude-code@2.1.308 -- claude plugin install machine-relations-index@machinerelations
          npm exec --yes --package=@anthropic-ai/claude-code@2.1.308 -- claude plugin list --json | tee "$RUNNER_TEMP/mr-claude-install.json"
          node scripts/verify-fresh-install.mjs
      - name: Package the tested source
        id: package
        shell: bash
        run: |
          VERSION=$(node -p "require('./plugins/machine-relations-index/plugin.json').version")
          mkdir -p dist
          (cd plugins/machine-relations-index && zip -qr ../../dist/machine-relations-index.zip .)
          (cd dist && sha256sum machine-relations-index.zip > SHA256SUMS)
          git rev-parse HEAD > dist/SOURCE_COMMIT
          echo "name=machine-relations-index-${VERSION}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/
          if-no-files-found: error

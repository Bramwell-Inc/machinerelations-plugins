name: Validate and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      draft_id:
        description: Existing Zenodo deposition id to read
        required: true
        type: string
      action:
        description: inspect reads only. delete-one removes one listed draft file after the checks pass, and stops if Zenodo returns 500. resume-reviewed publishes draft 24020018 from the reviewed 1.2.3 artifact and refuses while other files remain.
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - delete-one
          - resume-reviewed
      file_id:
        description: File id on that draft. Used only when action is delete-one.
        required: false
        type: string
permissions:
  contents: read
jobs:
  package:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.package.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Filename discovery. Recovery, package and action tests are included without editing this line.
      - run: node --test $(find scripts actions -name '*.test.mjs' -not -path '*/node_modules/*')
      - run: node scripts/validate-package.mjs
        env:
          PACKAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Fresh Codex and Claude Code installations
        shell: bash
        env:
          CODEX_HOME: ${{ runner.temp }}/mr-codex
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/mr-claude
          CLAUDE_CODE_DISABLE_OFFICIAL_MARKETPLACE_AUTOINSTALL: '1'
        run: |
          mkdir -p "$CODEX_HOME" "$CLAUDE_CONFIG_DIR"
          npm exec --yes --package=@openai/codex@0.163.0 -- codex plugin marketplace add "$GITHUB_WORKSPACE" --json
          npm exec --yes --package=@openai/codex@0.163.0 -- codex plugin add machine-relations-index@machinerelations --json | tee "$RUNNER_TEMP/mr-codex-install.json"
          npm exec --yes --package=@openai/codex@0.163.0 -- codex plugin list --json
          npm exec --yes --package=@anthropic-ai/claude-code@2.1.308 -- claude plugin marketplace add "$GITHUB_WORKSPACE"
          npm exec --yes --package=@anthropic-ai/claude-code@2.1.308 -- claude plugin install machine-relations-index@machinerelations
          npm exec --yes --package=@anthropic-ai/claude-code@2.1.308 -- claude plugin list --json | tee "$RUNNER_TEMP/mr-claude-install.json"
          node scripts/verify-fresh-install.mjs
      - name: Package the tested source
        id: package
        shell: bash
        run: |
          VERSION=$(node -p "require('./plugins/machine-relations-index/plugin.json').version")
          mkdir -p dist
          (cd plugins/machine-relations-index && zip -qrX ../../dist/machine-relations-index.zip .)
          node scripts/build-release.mjs --dist dist
          echo "name=machine-relations-index-${VERSION}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/
          if-no-files-found: error

  # A merged version bump becomes one release. A push that does not change the
  # package version does not run the publisher.
  release:
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: dist
      - id: trigger
        name: Release only a changed package version
        run: node scripts/release-trigger.mjs
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
      - name: Publish the release
        if: steps.trigger.outputs.publish == 'true'
        run: node scripts/publish-release.mjs --dist dist
        env:
          GH_TOKEN: ${{ github.token }}
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          VERCEL_DEPLOY_HOOKS: |
            ${{ secrets.VERCEL_DEPLOY_HOOK_JAXONPARROTT }}
            ${{ secrets.VERCEL_DEPLOY_HOOK_MACHINERELATIONS }}

  # Read an existing Zenodo draft with the release credential. Version and
  # concept come from this checkout; the reserved DOI must be 10.5281/zenodo/<draft id>.
  # inspect is the default and performs no write. delete-one removes one listed
  # draft file after that check. A 500 or a dropped response leaves the result
  # unknown and stops; the next write has to read the draft again. It does not
  # delete the deposition or publish.
  zenodo-draft:
    if: github.event_name == 'workflow_dispatch' && inputs.action != 'resume-reviewed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read the existing draft
        run: node scripts/zenodo-draft.mjs
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          DRAFT_ID: ${{ inputs.draft_id }}
          ACTION: ${{ inputs.action }}
          FILE_ID: ${{ inputs.file_id }}

  # Publish the reviewed 1.2.3 artifact onto the open draft. It downloads the
  # package artifact tested at 9a3357a. That library.json has null DOIs; the
  # reserved DOI is written into library.json and SHA256SUMS only after the
  # draft read confirms it. The zip, archives and SOURCE_COMMIT stay as tested.
  # It refuses while any file is listed. It does not rerun workflow 42274178672,
  # call newversion, or delete a file or a GitHub release.
  resume-reviewed:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'resume-reviewed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse a different draft id
        run: test "${{ inputs.draft_id }}" = "24020018"
      - uses: actions/download-artifact@v4
        with:
          name: machine-relations-index-1.2.3-9a3357a
          run-id: 42274178672
          github-token: ${{ github.token }}
          path: reviewed-dist
      - name: Publish the reviewed artifact onto the open draft
        run: node scripts/resume-reviewed.mjs --dist reviewed-dist
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          VERCEL_DEPLOY_HOOKS: |
            ${{ secrets.VERCEL_DEPLOY_HOOK_JAXONPARROTT }}
            ${{ secrets.VERCEL_DEPLOY_HOOK_MACHINERELATIONS }}

name: Machine Relations page check
description: Renders every page type of this commit's Vercel preview as people see it and as machines read it. The pull request comment says clean, blocking, or not judged. Only blocking fails the job.
inputs:
  anthropic-api-key:
    description: Optional. Adds non-blocking taste notes to the PR comment.
    required: false
  design-layer:
    description: Optional text of the site's design intent for taste notes. Never blocking.
    required: false
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - id: resolve
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: node "$GITHUB_ACTION_PATH/resolve.mjs"
    - if: steps.resolve.outputs.skip == ''
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: page-check-chromium-1.49.1
    - if: steps.resolve.outputs.skip == ''
      shell: bash
      working-directory: ${{ github.action_path }}/runtime
      run: |
        for i in 1 2 3; do npm ci --no-audit --no-fund && npx playwright install --with-deps chromium && break; sleep $((i * 10)); done
    - if: steps.resolve.outputs.skip == ''
      id: check
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        node "$GITHUB_ACTION_PATH/outcome.mjs" --reset page-check-report
        set +e
        RUNTIME="$GITHUB_ACTION_PATH/runtime"
        # Files this pull request edits: their pages are always read, and the first few rendered.
        : > page-check-changed.txt
        if [ -n "$PR" ]; then gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' > page-check-changed.txt 2>/dev/null; fi
        node "$RUNTIME/page-check.mjs" --access "$GITHUB_ACTION_PATH/access.mjs" --changed page-check-changed.txt --url "${{ steps.resolve.outputs.url }}" --base "${{ steps.resolve.outputs.base }}" --out page-check-report
        echo "checker_exit=$?" >> "$GITHUB_OUTPUT"
        exit 0
    - if: steps.resolve.outputs.skip == '' && hashFiles('page-check-report/report.json') != ''
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        DESIGN_LAYER: ${{ inputs.design-layer }}
      run: node "$GITHUB_ACTION_PATH/taste.mjs" page-check-report || true
    - if: github.event_name == 'pull_request' && steps.resolve.outcome == 'success'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        SKIP: ${{ steps.resolve.outputs.skip }}
        SKIP_DETAIL: ${{ steps.resolve.outputs.detail }}
        CHECKER_EXIT: ${{ steps.check.outputs.checker_exit }}
      run: node "$GITHUB_ACTION_PATH/comment.mjs" page-check-report
    - if: steps.resolve.outputs.skip == ''
      uses: actions/upload-artifact@v4
      with:
        name: page-check-report
        path: page-check-report
        retention-days: 14
        if-no-files-found: ignore
    - if: steps.resolve.outcome == 'success'
      shell: bash
      env:
        SKIP: ${{ steps.resolve.outputs.skip }}
        SKIP_DETAIL: ${{ steps.resolve.outputs.detail }}
        CHECKER_EXIT: ${{ steps.check.outputs.checker_exit }}
      run: node "$GITHUB_ACTION_PATH/gate.mjs" page-check-report
